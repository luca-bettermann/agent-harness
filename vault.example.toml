# Copy to vault.toml in a private instance. This file documents layout and
# enforcement bounds; concrete instance values belong in the copied file.

board = "Kanban.md"
tasks = ["tasks"]
repos = "repos"
columns = ["backlog", "open", "in progress", "promotion"]
merge_branch_prefix = "merge-"

# Startup refresh reads this registry. Each scope names exactly one branch or
# one full commit pin. Paths resolve from this file's directory.
[scopes]
agents = { path = ".", branch = "main" }
personal = { path = "../personal", branch = "main" }
team = { path = "../team-wiki", branch = "main" }
# archive = { path = "../archive", pin = "0123456789abcdef0123456789abcdef01234567" }

[caps]
root = 15000
"doctrine/" = 15000
"tasks/" = 10000
